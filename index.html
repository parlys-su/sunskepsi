<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sunskepsi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1><a href="index.html">sunskepsi</a></h1>


<nav>
    <a href="arquivo.html">arquivo</a>
    <a href="fragmentos.html">fragmentos</a>
    <a href="estudos.html">estudos</a>
    <a href="perguntas.html">perguntas</a>
    <a href="sobre.html">sobre</a>
</nav>


</header>

<main>


<section>
    <h2>mais recente</h2>

    <div id="mais-recente"></div>
</section>

<section>
    <h2>arquivo</h2>

    <div id="arquivo"></div>
</section>

<section>
    <h2>fragmentos</h2>

    <div id="fragmentos"></div>
</section>

<section>
    <h2>estudos</h2>

    <div id="estudos"></div>
</section>

<section>
    <h2>perguntas</h2>

    <div id="perguntas"></div>
</section>


</main>

<footer>
    <span>~sun</span>
</footer>

<script>
fetch("posts.json")
    .then(response => response.json())
    .then(posts => {

        posts.sort((a, b) => b.data.localeCompare(a.data));

        function criarPost(post) {
            return `
                <article>
                    <h3>
                        <a href="${post.link}">
                            ${post.titulo}
                        </a>
                    </h3>

                    <time datetime="${post.data}">
                        ${post.dataExibicao}
                    </time>
                </article>
            `;
        }

        if (posts.length > 0) {
            document.getElementById("mais-recente").innerHTML =
                criarPost(posts[0]);
        }

        const categorias = ["arquivo", "fragmentos", "estudos", "perguntas"];

        categorias.forEach(categoria => {

            const postsDaCategoria = posts
                .filter(post => post.categoria === categoria)
                .slice(0, 2);

            document.getElementById(categoria).innerHTML =
                postsDaCategoria.map(criarPost).join("");

        });

    })
    .catch(error => {
        console.error("Erro ao carregar posts.json:", error);
    });
</script>

</body>
</html>
