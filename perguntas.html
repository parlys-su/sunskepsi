<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perguntas — sunskepsi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1><a href="index.html">sunskepsi</a></h1>

    <nav>
        <a href="arquivo.html">arquivo</a>
        <a href="fragmentos.html">fragmentos</a>
        <a href="estudos.html">estudos</a>
        <a href="perguntas.html">perguntas</a>
        <a href="sobre.html">sobre</a>
    </nav>
</header>

<main>

    <section>

        <h2>perguntas</h2>

        <div id="lista-perguntas">
            <p>carregando...</p>
        </div>

    </section>

</main>

<footer>
    <span>~sun</span>
</footer>

<script>

fetch("posts.json")
    .then(response => response.json())
    .then(posts => {

        const lista = document.getElementById("lista-perguntas");

        const postsPerguntas = posts
            .filter(post => post.categoria === "perguntas")
            .sort((a, b) => b.data.localeCompare(a.data));

        if (postsPerguntas.length === 0) {
            lista.innerHTML = "<p>ainda não há perguntas.</p>";
            return;
        }

        lista.innerHTML = postsPerguntas.map(post => `
            <article>

                <h3>
                    <a href="${post.link}">
                        ${post.titulo}
                    </a>
                </h3>

                <time datetime="${post.data}">
                    ${post.dataExibicao}
                </time>

            </article>
        `).join("");

    })
    .catch(error => {
        console.error("Erro ao carregar posts.json:", error);
    });

</script>

</body>

</html>
